<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>pi-swarm</title>
<style>
  :root { --bg:#0b0d10; --card:#14181d; --card2:#1a2027; --line:#232a32; --fg:#e6e9ee; --mut:#8a94a3; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --acc:#58a6ff; --pur:#bc8cff; --gray:#6e7681; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --card:#fff; --card2:#f3f4f6; --line:#e3e6ea; --fg:#1b1f24; --mut:#6b7380; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:18px 16px 48px; }
  header { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin-bottom:12px; }
  h1 { font-size:19px; margin:0; }
  h2 { font-size:13px; margin:0 0 10px; font-weight:600; }
  .mut { color:var(--mut); }
  .num { font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .t-ok { color:var(--ok); } .t-warn { color:var(--warn); } .t-crit { color:var(--bad); } .t-info { color:var(--acc); }
  .b-ok { background:rgba(63,185,80,.14); color:var(--ok); } .b-warn { background:rgba(210,153,34,.16); color:var(--warn); }
  .b-crit { background:rgba(248,81,73,.16); color:var(--bad); } .b-info { background:rgba(88,166,255,.15); color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .section { margin-bottom:14px; }
  .banner { border-radius:12px; padding:10px 14px; margin-bottom:14px; font-weight:600; }
  .grid { display:grid; gap:10px; }
  .kpis { grid-template-columns:repeat(5,1fr); }
  .tiles { grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
  .two { grid-template-columns:1fr 1fr; }
  @media (max-width:980px) { .kpis { grid-template-columns:1fr 1fr; } .two { grid-template-columns:1fr; } }
  .k { font-size:12px; color:var(--mut); }
  .v { font-size:22px; font-weight:650; margin-top:2px; }
  .sub { font-size:11.5px; color:var(--mut); margin-top:2px; }
  .bar { height:12px; border-radius:999px; background:var(--line); overflow:hidden; display:flex; }
  .bar > i { display:block; height:100%; transition:width .4s ease; }
  .mini { height:6px; border-radius:999px; background:var(--line); overflow:hidden; }
  .mini > i { display:block; height:100%; background:var(--acc); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--mut); margin-top:8px; }
  .legend b { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .chart { position:relative; }
  .chart svg { width:100%; height:150px; display:block; }
  .chart .max { position:absolute; left:0; top:-2px; font-size:11px; color:var(--mut); }
  .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--mut); margin-top:4px; }
  .tip { position:absolute; top:6px; pointer-events:none; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; white-space:nowrap; display:none; z-index:2; }
  .cursor { position:absolute; top:0; bottom:0; width:1px; background:var(--mut); opacity:.5; display:none; pointer-events:none; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td, th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:500; white-space:nowrap; }
  td.r, th.r { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.nw { white-space:nowrap; }
  code { font:12px ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-word; }
  a.tlink { color:var(--acc); text-decoration:none; cursor:pointer; font:12px ui-monospace,Menlo,monospace; }
  a.tlink:hover { text-decoration:underline; }
  details > summary { cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  details pre { margin:8px 0 0; padding:8px; background:var(--card2); border-radius:8px; white-space:pre-wrap; word-break:break-word; font:12px ui-monospace,Menlo,monospace; }
  .hbar { display:grid; grid-template-columns:minmax(90px,34%) 1fr auto; gap:8px; align-items:center; font-size:12.5px; padding:3px 0; }
  .lookup { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .lookup input { background:var(--card2); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:5px 10px; font-size:12.5px; width:180px; }
  .lookup button { background:var(--acc); color:#fff; border:none; border-radius:8px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; }
  .drawer-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .drawer { background:var(--card); border:1px solid var(--line); border-radius:14px; max-width:920px; width:100%; max-height:86vh; display:flex; flex-direction:column; overflow:hidden; }
  .drawer-hd { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  .drawer-bd { padding:14px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .turn { background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12.5px; }
  .turn .role { font-weight:700; font-size:11.5px; text-transform:uppercase; margin-bottom:4px; }
  .turn pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; font:12px ui-monospace,Menlo,monospace; max-height:280px; overflow-y:auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">pi-swarm</h1>
    <span id="status" class="pill b-info">…</span>
    <span class="mut" id="meta"></span>
  </header>

  <div id="banner" class="banner b-info">…</div>

  <div class="card section">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px">
      <b id="progText" class="num">—</b><span class="mut num" id="eta"></span>
    </div>
    <div class="bar" id="progBar"></div>
    <div class="legend" id="progLegend"></div>
  </div>

  <div class="grid kpis section" id="kpis"></div>

  <div id="panels"></div>

  <div class="grid two section">
    <div class="card">
      <h2 id="h-results"></h2>
      <div class="chart" id="chartResults"></div>
      <div class="legend" id="lg-results"></div>
    </div>
    <div class="card">
      <h2 id="h-gate"></h2>
      <div class="chart" id="chartGate"></div>
      <div class="legend" id="lg-gate"></div>
    </div>
  </div>

  <div class="card section">
    <h2 id="h-pools"></h2>
    <div class="tablewrap"><table><thead id="poolsHead"></thead><tbody id="pools"></tbody></table></div>
    <div id="endpointsWrap" style="display:none;margin-top:12px">
      <h2 id="h-endpoints"></h2>
      <div class="tablewrap"><table><thead id="epHead"></thead><tbody id="endpoints"></tbody></table></div>
    </div>
    <div class="grid tiles" id="metrics" style="margin-top:12px"></div>
  </div>

  <div id="failedSection" class="card section" style="display:none">
    <h2 id="h-failed"></h2>
    <div class="tablewrap"><table><thead id="failHead"></thead><tbody id="failedBody"></tbody></table></div>
  </div>

  <div class="grid two section">
    <div class="card">
      <h2 id="h-errors"></h2>
      <div id="errors"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <h2 id="h-longest" style="margin:0"></h2>
        <form class="lookup" id="inspectForm" style="margin:0">
          <input id="inspectInput" placeholder="Task ID (e.g. 0001)" />
          <button type="submit" id="inspectBtn">Inspect</button>
        </form>
      </div>
      <div class="tablewrap" style="margin-top:8px"><table><thead id="longHead"></thead><tbody id="longest"></tbody></table></div>
    </div>
  </div>
</main>

<div class="drawer-bg" id="drawerBg">
  <div class="drawer">
    <div class="drawer-hd">
      <b id="drawerTitle">Task</b>
      <button id="drawerClose" style="background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:3px 10px;cursor:pointer">✕</button>
    </div>
    <div class="drawer-bd" id="drawerBody"></div>
  </div>
</div>

<script>
const ZH = (navigator.language || '').toLowerCase().startsWith('zh');
const T = ZH ? {
  running:'运行中', paused:'已暂停', done:'已完成', stale:'无更新', idle:'未启动', reconnect:'重连中',
  elapsed:'已运行', workers:'个 worker', updated:'更新于', eta:'预计剩余', rateUnit:'/分钟',
  remaining:'剩余', tasksUnit:'任务',
  kRate:'产出速度', kRateSub:'近 5 分钟平均', kWait:'排队等待 p95', kWaitSub:(t)=>`超时上限 ${t}`, kOk:'模型请求成功率', kOkSub:'近 60 秒',
  kSess:'活跃会话', kSessSub:(cap,r,b)=>`准入上限 ${cap} · 恢复 ${r} · 退避 ${b}`,
  kCost:'Token 与花费', kCostSub:(i,o)=>`输入 ${i} · 输出 ${o}`,
  hResults:'模型请求结果（每 10 秒）', hGate:'名额与排队', hPools:'资源池与指标', hEndpoints:'多端点 / 备用模型路由',
  hFailed:'失败任务（已达最大重试次数，点击查看会话）', hErrors:'错误归类', hLongest:'运行最久的任务（点击查看会话）',
  ok:'成功', backoff:'限流 429/503', net:'中断/超时', other:'其他错误', limit:'名额上限', inflight:'在途', waiting:'排队',
  pool:'资源池', used:'在途 / 上限', lastMin:'近 60 秒 / 每分钟上限', gate:'模型请求', none:'暂无', task:'任务', runFor:'已运行', attempt:'尝试', failures:'失败次数', error:'错误',
  noLimit:'不限', collecting:'统计中', retries:'会话内重试', continuations:'续跑', stalled:'卡死中断', priority:'其中重试优先', inspect:'查看会话',
  health:{ idle:'尚未启动', finished:'全部完成',
    finished_with_failures:p=>`运行结束：完成 ${p.done} 个，失败 ${p.failed} 个（可用 pi-swarm retry 重跑失败项）`,
    circuit_breaker:p=>`已自动熔断暂停：${p.reason}（修复后执行 pi-swarm resume 继续）`,
    budget_exceeded:p=>`已达预算上限自动暂停：${p.reason}（可用 pi-swarm budget --usd <新预算> 放行）`,
    paused:p=>`已暂停：${p.reason}（执行 pi-swarm resume 继续）`,
    stale:p=>`已有 ${p.ageSec} 秒没有更新，调度进程可能已停止`,
    upstream_errors:p=>`上游大量报错：近 60 秒 ${pct(p.share)} 的请求返回错误（${p.count} 次），请检查鉴权或接口`,
    queue_wait:p=>`排队过长：等待 p95 已到 ${fmtSec(p.waitSec)}，超时上限是 ${fmtSec(p.timeoutSec)}`,
    network_failures:p=>`请求中断偏多：近 60 秒 ${pct(p.share)}（${p.count} 次）`,
    rate_limited:p=>`上游在限流：近 60 秒 ${pct(p.share)} 的请求是 429/503，名额会自动下调`,
    no_progress:()=>'近 5 分钟没有新的完成量',
    healthy:p=>p.ratePerMin==null?'运行正常，速度统计中':`运行正常，约 ${fmtRate(p.ratePerMin)} 个/分钟` },
} : {
  running:'Running', paused:'Paused', done:'Completed', stale:'Stale', idle:'Idle', reconnect:'Reconnecting',
  elapsed:'Elapsed', workers:'workers', updated:'updated', eta:'ETA', rateUnit:'/min',
  remaining:'remaining', tasksUnit:'tasks',
  kRate:'Throughput', kRateSub:'5-minute average', kWait:'Queue wait p95', kWaitSub:(t)=>`timeout ${t}`, kOk:'LLM success rate', kOkSub:'last 60s',
  kSess:'Active sessions', kSessSub:(cap,r,b)=>`cap ${cap} · resumed ${r} · backoff ${b}`,
  kCost:'Tokens & Cost', kCostSub:(i,o)=>`in ${i} · out ${o}`,
  hResults:'LLM request results (per 10s)', hGate:'Gate limit and queue', hPools:'Resource pools and metrics', hEndpoints:'Endpoint & fallback routing',
  hFailed:'Failed tasks (max retries reached — click ID to inspect)', hErrors:'Errors by type', hLongest:'Longest-running tasks (click ID to inspect)',
  ok:'OK', backoff:'429/503', net:'Aborted/timeout', other:'Other errors', limit:'Limit', inflight:'In flight', waiting:'Waiting',
  pool:'Pool', used:'In flight / limit', lastMin:'Last 60s / per-minute cap', gate:'LLM requests', none:'None', task:'Task', runFor:'Running for', attempt:'Attempt', failures:'Failures', error:'Error',
  noLimit:'no cap', collecting:'collecting', retries:'in-session retries', continuations:'continuations', stalled:'stalled aborts', priority:'priority retries', inspect:'Inspect',
  health:{ idle:'Not started', finished:'All done',
    finished_with_failures:p=>`Finished: ${p.done} complete, ${p.failed} failed (run pi-swarm retry to re-run failed tasks)`,
    circuit_breaker:p=>`Circuit breaker tripped (paused): ${p.reason} — fix issue then run pi-swarm resume`,
    budget_exceeded:p=>`Paused at budget cap: ${p.reason} — raise with pi-swarm budget --usd <amount>`,
    paused:p=>`Paused: ${p.reason} — run pi-swarm resume to continue`,
    stale:p=>`No update for ${p.ageSec}s; the supervisor may be down`,
    upstream_errors:p=>`Upstream errors: ${pct(p.share)} of requests failed in the last 60s (${p.count})`,
    queue_wait:p=>`Queue is too long: p95 wait ${fmtSec(p.waitSec)} against a ${fmtSec(p.timeoutSec)} timeout`,
    network_failures:p=>`Many aborted requests: ${pct(p.share)} in the last 60s (${p.count})`,
    rate_limited:p=>`Upstream is rate limiting: ${pct(p.share)} of requests got 429/503; the gate is backing off`,
    no_progress:()=>'No completed items in the last 5 minutes',
    healthy:p=>p.ratePerMin==null?'Healthy, measuring throughput':`Healthy, about ${fmtRate(p.ratePerMin)} items/min` },
};
document.documentElement.lang = ZH ? 'zh-CN' : 'en';
const $id = id => document.getElementById(id);
function $(id) { return $id(id); }
$('inspectBtn').textContent = T.inspect;
const fmt = n => (Number(n) || 0).toLocaleString();
const fmtTok = n => { n = Number(n) || 0; return n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n); };
const fmtRate = n => n >= 10 ? Math.round(n).toLocaleString() : (Math.round(n * 10) / 10).toString();
const pct = x => (x * 100).toFixed(x < 0.1 ? 1 : 0) + '%';
const fmtSec = s => { s = Math.round(s); return s >= 3600 ? `${Math.floor(s/3600)}h${Math.floor(s%3600/60)}m` : s >= 60 ? `${Math.floor(s/60)}m${s%60}s` : `${s}s`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }) : '';
const TONE = { ok:'--ok', success:'--ok', warn:'--warn', warning:'--warn', crit:'--bad', error:'--bad', info:'--acc', muted:'--gray', neutral:'--gray' };
const TONE_CLASS = { ok:'ok', success:'ok', warn:'warn', warning:'warn', crit:'crit', error:'crit', info:'info' };
const SEG_COLORS = ['--ok', '--warn', '--acc', '--pur', '--gray'];
const toneVar = (tone, i = 0) => TONE[tone] || SEG_COLORS[i % SEG_COLORS.length];

function tile(k, v, sub = '', tone = '', extraHtml = '') {
  return `<div class="card"><div class="k">${esc(k)}</div><div class="v num ${tone ? 't-' + tone : ''}">${v}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}${extraHtml}</div>`;
}
function legend(el, items) { el.innerHTML = items.map(([label, color]) => `<span><b style="background:var(${color})"></b>${esc(label)}</span>`).join(''); }
function taskLink(id) { return `<a class="tlink" data-task="${esc(id)}">${esc(id)}</a>`; }

const chartState = new WeakMap();
function chart(el, rows, { bars = [], lines = [] }) {
  const W = 600, H = 150, n = Math.max(rows.length, 1), bw = W / n;
  const max = Math.max(1, ...rows.map(r => bars.reduce((a, s) => a + (r[s.key] || 0), 0)), ...lines.flatMap(l => rows.map(r => r[l.key] || 0)));
  let svg = '';
  rows.forEach((r, i) => {
    let y = H;
    for (const s of bars) {
      const h = (r[s.key] || 0) / max * (H - 6);
      if (h > 0) { y -= h; svg += `<rect x="${(i * bw + 0.5).toFixed(2)}" y="${y.toFixed(2)}" width="${Math.max(bw - 1, 0.5).toFixed(2)}" height="${h.toFixed(2)}" fill="${css(s.color)}"/>`; }
    }
  });
  for (const l of lines) {
    if (!rows.length) continue;
    const pts = rows.map((r, i) => `${(i * bw + bw / 2).toFixed(2)},${(H - (r[l.key] || 0) / max * (H - 6)).toFixed(2)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${css(l.color)}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  }
  if (!el.firstChild) {
    el.innerHTML = `<div class="max num"></div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"></svg><div class="cursor"></div><div class="tip"></div><div class="axis"><span></span><span></span><span></span></div>`;
    el.addEventListener('mousemove', ev => showTip(el, ev));
    el.addEventListener('mouseleave', () => { el.querySelector('.tip').style.display = 'none'; el.querySelector('.cursor').style.display = 'none'; });
  }
  el.querySelector('svg').innerHTML = svg;
  el.querySelector('.max').textContent = fmt(Math.round(max));
  const ax = el.querySelectorAll('.axis span');
  ax[0].textContent = hhmm(rows[0]?.at); ax[1].textContent = hhmm(rows[Math.floor(rows.length / 2)]?.at); ax[2].textContent = hhmm(rows.at(-1)?.at);
  chartState.set(el, { rows, series: [...bars, ...lines] });
}
function showTip(el, ev) {
  const st = chartState.get(el); if (!st || !st.rows.length) return;
  const svgBox = el.querySelector('svg').getBoundingClientRect();
  const x = Math.min(Math.max(ev.clientX - svgBox.left, 0), svgBox.width - 1);
  const r = st.rows[Math.floor(x / svgBox.width * st.rows.length)]; if (!r) return;
  const tip = el.querySelector('.tip'), cur = el.querySelector('.cursor');
  tip.innerHTML = `<div class="mut">${hhmm(r.at)}</div>` + st.series.map(s => `<div><b style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(${s.color});margin-right:5px"></b>${esc(s.label)} <b class="num">${fmt(r[s.key])}</b></div>`).join('');
  tip.style.display = 'block'; cur.style.display = 'block'; cur.style.left = x + 'px'; cur.style.height = svgBox.height + 'px';
  tip.style.left = (x > svgBox.width / 2 ? x - tip.offsetWidth - 10 : x + 10) + 'px';
}

function renderPanel(p) {
  const title = p.title ? `<h2>${esc(p.title)}</h2>` : '';
  if (p.type === 'stats') {
    return `<div class="section">${title}<div class="grid tiles">${(p.items || []).map(it => tile(it.label, typeof it.value === 'number' ? fmt(it.value) : esc(it.value), it.sub || '', TONE_CLASS[it.tone] || '')).join('')}</div></div>`;
  }
  if (p.type === 'table') {
    const cols = p.columns || [];
    return `<div class="card section">${title}<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
      (p.rows || []).length ? p.rows.slice(0, 50).map(r => `<tr>${r.map(c => typeof c === 'number' ? `<td class="r">${fmt(c)}</td>` : `<td${String(c ?? '').length <= 14 ? ' class="nw"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('')
        : `<tr><td colspan="${cols.length || 1}" class="mut">${T.none}</td></tr>`}</tbody></table></div></div>`;
  }
  if (p.type === 'bars') {
    const items = (p.items || []).slice(0, 20), max = Math.max(1, ...items.map(i => Number(i.value) || 0));
    return `<div class="card section">${title}${items.map(it => `<div class="hbar"><span>${esc(it.label)}</span><div class="mini"><i style="width:${(Number(it.value) || 0) / max * 100}%;background:var(${toneVar(it.tone, 2)})"></i></div><b class="num">${fmt(it.value)}${p.unit ? ' ' + esc(p.unit) : ''}</b></div>`).join('') || `<div class="mut">${T.none}</div>`}</div>`;
  }
  return `<div class="card section">${title}<div style="white-space:pre-wrap">${esc(p.text || '')}</div></div>`;
}

let openErrors = new Set();
function render(s) {
  const { live, timeline = [], progress = {}, health = {}, panels = [], metricsMeta = {}, timeoutMs = 0 } = s;
  const lvl = health.level || 'idle';
  const cls = { ok:'b-ok', warn:'b-warn', crit:'b-crit', done:'b-ok', idle:'b-info' }[lvl];
  const hm = T.health[health.code];
  $('banner').className = 'banner ' + cls;
  $('banner').textContent = typeof hm === 'function' ? hm(health.params || {}) : (hm || '');
  if (!live || !live.tasks) { $('status').className = 'pill b-info'; $('status').textContent = T.idle; return; }

  const pillCls = live.finishedAt ? 'b-ok' : live.paused ? 'b-warn' : health.code === 'stale' ? 'b-warn' : 'b-info';
  const pillTxt = live.finishedAt ? T.done : live.paused ? T.paused : health.code === 'stale' ? T.stale : T.running;
  $('status').className = 'pill ' + pillCls;
  $('status').textContent = pillTxt;
  $('title').textContent = live.run?.name || live.run?.id || 'pi-swarm';
  const total = progress.total || 0, done = progress.done || 0;
  document.title = `${Math.floor(total ? done / total * 100 : 0)}% · ${live.run?.name || 'pi-swarm'}`;
  $('meta').textContent = `${live.run?.id} · ${T.elapsed} ${fmtSec(live.elapsedSec || 0)} · ${live.run?.workers || 0} ${T.workers} · ${T.updated} ${hhmm(live.at)}`;

  const unit = progress.source === 'tasks' ? T.tasksUnit : (progress.unit || '');
  const pctDone = total ? (done / total * 100).toFixed(1) : '0.0';
  $('progText').textContent = ZH
    ? `${fmt(done)} / ${fmt(total)} ${unit}（${pctDone}%）· ${T.remaining} ${fmt(progress.remaining)}`
    : `${fmt(done)} / ${fmt(total)} ${unit} (${pctDone}%) · ${fmt(progress.remaining)} ${T.remaining}`;
  const segs = Array.isArray(progress.segments) ? [...progress.segments] : [{ label: T.done, value: done, tone: 'ok' }];
  if (progress.source === 'tasks' && (live.tasks.failed || 0) > 0) {
    segs.push({ label: T.failures, value: live.tasks.failed, tone: 'crit' });
  }
  $('progBar').innerHTML = segs.map((g, i) => `<i style="width:${total ? (Number(g.value) || 0) / total * 100 : 0}%;background:var(${toneVar(g.tone, i)})" title="${esc(g.label)}"></i>`).join('');
  $('progLegend').innerHTML = segs.length > 1 || progress.segments?.length ? segs.map((g, i) => `<span><b style="background:var(${toneVar(g.tone, i)})"></b>${esc(g.label)} <b class="num" style="background:none;width:auto;height:auto;color:var(--fg)">${fmt(g.value)}</b></span>`).join('') : '';
  $('eta').textContent = live.finishedAt ? '' : progress.etaSec != null ? `${T.eta} ${fmtSec(progress.etaSec)}` : '';

  const g = live.gate || {}, t = live.tasks, last = timeline.at(-1) || {}, u = live.usage || {};
  const recent = timeline.slice(-6).reduce((a, r) => ({ ok: a.ok + (r.window?.ok || 0), all: a.all + (r.window?.ok || 0) + (r.window?.backoff || 0) + (r.window?.other || 0) + (r.window?.net || 0) }), { ok: 0, all: 0 });
  const okShare = recent.all ? recent.ok / recent.all : null;
  const waitMs = Number(last.waitP95) || 0;
  const waitTone = timeoutMs && waitMs >= timeoutMs * 0.8 ? 'crit' : timeoutMs && waitMs >= timeoutMs * 0.5 ? 'warn' : '';
  const costVal = u.costUsd > 0 || live.budgetUsd ? `$${(Number(u.costUsd) || 0).toFixed(2)}` : fmtTok((u.inputTokens || 0) + (u.outputTokens || 0));
  const budgetBar = live.budgetUsd > 0 ? `<div class="mini" style="margin-top:6px"><i style="width:${Math.min(100, (u.costUsd || 0) / live.budgetUsd * 100)}%;background:var(${(u.costUsd || 0) >= live.budgetUsd ? '--bad' : '--ok'})"></i></div><div class="sub num">$${(u.costUsd || 0).toFixed(3)} / $${Number(live.budgetUsd).toFixed(2)}</div>` : '';

  $('kpis').innerHTML = [
    tile(T.kRate, progress.ratePerMin == null ? '—' : `${fmtRate(progress.ratePerMin)}<span class="sub"> ${esc(unit)}${T.rateUnit}</span>`, progress.ratePerMin == null ? T.collecting : T.kRateSub, progress.ratePerMin === 0 ? 'warn' : ''),
    tile(T.kWait, last.waitP95 != null ? fmtSec(waitMs / 1000) : '—', timeoutMs ? T.kWaitSub(fmtSec(timeoutMs / 1000)) : `p50 ${fmtSec((Number(last.waitP50) || 0) / 1000)}`, waitTone),
    tile(T.kOk, okShare == null ? '—' : pct(okShare), `${T.kOkSub} · ${fmt(recent.ok)} / ${fmt(recent.all)}`, okShare == null ? '' : okShare < 0.5 ? 'crit' : okShare < 0.8 ? 'warn' : 'ok'),
    tile(T.kSess, fmt(t.active), T.kSessSub(fmt(live.sessionCap || t.total), fmt(live.resumedSessions || 0), fmt(t.backoff ?? 0))),
    tile(T.kCost, costVal, T.kCostSub(fmtTok(u.inputTokens), fmtTok(u.outputTokens)), '', budgetBar),
  ].join('');

  $('panels').innerHTML = panels.map(renderPanel).join('');

  $('h-results').textContent = T.hResults; $('h-gate').textContent = T.hGate;
  const rows = timeline.map(r => ({ at: r.at, ok: r.window?.ok || 0, backoff: r.window?.backoff || 0, net: r.window?.net || 0, other: r.window?.other || 0, limit: r.limit || 0, inflight: r.inflight || 0, waiting: r.waiting || 0 }));
  const S1 = [{ key:'ok', color:'--ok', label:T.ok }, { key:'backoff', color:'--warn', label:T.backoff }, { key:'net', color:'--gray', label:T.net }, { key:'other', color:'--bad', label:T.other }];
  const S2 = [{ key:'limit', color:'--acc', label:T.limit }, { key:'inflight', color:'--pur', label:T.inflight }, { key:'waiting', color:'--warn', label:T.waiting }];
  chart($('chartResults'), rows, { bars: S1 }); legend($('lg-results'), S1.map(x => [x.label, x.color]));
  chart($('chartGate'), rows, { lines: S2 }); legend($('lg-gate'), S2.map(x => [x.label, x.color]));

  $('h-pools').textContent = T.hPools;
  $('poolsHead').innerHTML = `<tr><th>${T.pool}</th><th>${T.used}</th><th class="r">${T.waiting}</th><th>${T.lastMin}</th></tr>`;
  const poolRow = (name, inflight, limit, waiting, lastMinute, perMinute, extra = '') => `<tr><td class="nw"><b>${esc(name)}</b>${extra ? `<div class="sub">${esc(extra)}</div>` : ''}</td>
    <td style="min-width:150px"><span class="num">${fmt(inflight)} / ${fmt(limit)}</span><div class="mini" style="margin-top:4px"><i style="width:${limit ? Math.min(100, inflight / limit * 100) : 0}%"></i></div></td>
    <td class="r ${waiting > 0 ? 't-warn' : ''}">${fmt(waiting)}</td>
    <td style="min-width:150px">${perMinute ? `<span class="num">${fmt(lastMinute)} / ${fmt(perMinute)}</span><div class="mini" style="margin-top:4px"><i style="width:${Math.min(100, lastMinute / perMinute * 100)}%"></i></div>` : `<span class="mut">${T.noLimit}</span>`}</td></tr>`;
  $('pools').innerHTML = poolRow(T.gate, g.inflight || 0, g.limit || 0, g.waiting || 0, g.tokensLastMinute || 0, g.tpm || 0, `${fmt(g.min)}–${fmt(g.max)} · ${T.priority} ${fmt(g.priorityWaiting || 0)}`) +
    Object.entries(live.pools || {}).map(([name, p]) => poolRow(name, p.inflight, p.limit, p.waiting, p.lastMinute || 0, p.perMinute || 0)).join('');

  const epEntries = Object.entries(live.endpoints || {});
  if (epEntries.length > 0) {
    $('endpointsWrap').style.display = 'block';
    $('h-endpoints').textContent = T.hEndpoints;
    $('epHead').innerHTML = `<tr><th>Endpoint</th><th class="r">${T.ok}</th><th class="r">${T.backoff}</th><th class="r">${T.other}</th></tr>`;
    $('endpoints').innerHTML = epEntries.map(([name, st]) => `<tr><td><code>${esc(name)}</code></td><td class="r">${fmt(st.ok)}</td><td class="r">${fmt(st.backoff)}</td><td class="r">${fmt(st.other)}</td></tr>`).join('');
  } else {
    $('endpointsWrap').style.display = 'none';
  }

  $('metrics').innerHTML = [
    tile(T.retries, fmt(live.pi?.retries), `${T.continuations} ${fmt(live.pi?.continuations)} · ${T.stalled} ${fmt(live.pi?.stalledAborts || 0)}`),
    ...Object.entries(live.metrics || {}).map(([name, val]) => { const m = metricsMeta[name] || {}; return tile(m.label || name, fmt(val) + (m.unit ? `<span class="sub"> ${esc(m.unit)}</span>` : ''), m.label ? name : ''); }),
  ].join('');

  const failedList = live.failedTasks || [];
  if (failedList.length > 0) {
    $('failedSection').style.display = 'block';
    $('h-failed').textContent = `${T.hFailed} (${fmt(live.tasks.failed)})`;
    $('failHead').innerHTML = `<tr><th>${T.task}</th><th class="r">${T.failures}</th><th>${T.error}</th></tr>`;
    $('failedBody').innerHTML = failedList.map(f => `<tr><td class="nw">${taskLink(f.id)}</td><td class="r t-crit">${fmt(f.failures)}</td><td><code>${esc(f.error || '')}</code></td></tr>`).join('');
  } else {
    $('failedSection').style.display = 'none';
  }

  $('h-errors').textContent = T.hErrors; $('h-longest').textContent = T.hLongest;
  document.querySelectorAll('#errors details[open]').forEach(d => openErrors.add(d.dataset.k));
  document.querySelectorAll('#errors details:not([open])').forEach(d => openErrors.delete(d.dataset.k));
  const groups = live.errorGroups || [];
  $('errors').innerHTML = groups.length ? groups.map(e => `<details data-k="${esc(e.key)}" ${openErrors.has(e.key) ? 'open' : ''}><summary><div class="hbar" style="grid-template-columns:auto 1fr auto"><b class="num pill b-warn">${fmt(e.count)}</b><code>${esc(e.key)}</code><span class="mut nw">${hhmm(e.lastAt)}</span></div></summary><pre>${T.task} ${taskLink(e.lastTask)}\n${esc(e.sample)}</pre></details>`).join('') : `<div class="mut">${T.none}</div>`;
  $('longHead').innerHTML = `<tr><th>${T.task}</th><th class="r">${T.runFor}</th><th class="r">${T.attempt}</th></tr>`;
  const longest = live.longestRunning || [];
  $('longest').innerHTML = longest.length ? longest.map(x => `<tr><td>${taskLink(x.id)}</td><td class="r">${fmtSec(x.runningSec)}</td><td class="r">${fmt(x.attempt)}</td></tr>`).join('') : `<tr><td colspan="3" class="mut">${T.none}</td></tr>`;
}

async function openInspect(taskId) {
  if (!taskId) return;
  $('drawerTitle').textContent = `${T.task} ${taskId}`;
  $('drawerBody').innerHTML = `<div class="mut">Loading…</div>`;
  $('drawerBg').style.display = 'flex';
  try {
    const r = await fetch(`api/task?id=${encodeURIComponent(taskId)}`);
    const d = await r.json();
    if (!r.ok) { $('drawerBody').innerHTML = `<div class="t-crit">${esc(d.error || 'Not found')}</div>`; return; }
    const headerHtml = `<div class="turn"><b>Status:</b> ${esc(d.status)} · <b>Attempt:</b> ${d.attempt} · <b>Failures:</b> ${d.failures} · <b>Tokens:</b> ${fmt(d.input_tokens)} in / ${fmt(d.output_tokens)} out ($${Number(d.cost_usd || 0).toFixed(4)})${d.last_error ? `<pre class="t-crit">${esc(d.last_error)}</pre>` : ''}</div>`;
    const entries = (d.entries || []).filter(e => e.type === 'message' || e.message);
    const turnsHtml = entries.length ? entries.map(e => {
      const m = e.message || e;
      const role = m.role || e.type || 'entry';
      const body = typeof m.content === 'string' ? m.content : JSON.stringify(m.content ?? m, null, 2);
      const errLine = m.errorMessage ? `\n[ERROR] ${m.errorMessage}` : '';
      return `<div class="turn"><div class="role ${role === 'assistant' ? 't-info' : role === 'toolResult' ? 't-ok' : ''}">${esc(role)}${m.stopReason ? ` (${esc(m.stopReason)})` : ''}</div><pre>${esc(body + errLine)}</pre></div>`;
    }).join('') : `<div class="mut">No session checkpoint stored (completed sessions are pruned unless retainSessions or sample mode is enabled).</div>`;
    $('drawerBody').innerHTML = headerHtml + turnsHtml;
  } catch (err) {
    $('drawerBody').innerHTML = `<div class="t-crit">${esc(err.message)}</div>`;
  }
}

document.addEventListener('click', ev => {
  const a = ev.target.closest('a.tlink');
  if (a && a.dataset.task) { ev.preventDefault(); void openInspect(a.dataset.task); }
});
$('inspectForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const v = $('inspectInput').value.trim();
  if (v) void openInspect(v);
});
$('drawerClose').addEventListener('click', () => { $('drawerBg').style.display = 'none'; });
$('drawerBg').addEventListener('click', ev => { if (ev.target === $('drawerBg')) $('drawerBg').style.display = 'none'; });

function pollState() {
  fetch('api/state', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(d => render(d))
    .catch(() => { $('status').className = 'pill b-warn'; $('status').textContent = T.reconnect; });
}
function connect() {
  pollState();
  setInterval(pollState, 3000);
  try {
    const es = new EventSource('events');
    es.onmessage = e => { try { render(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  } catch {}
}
connect();
</script>
</body>
</html>
